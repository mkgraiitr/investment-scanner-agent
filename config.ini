[agent]
# Ollama model used for reasoning/tool-calling. Must be a tool-calling
# capable model you've already pulled, e.g.: ollama pull llama3.1
ollama_model = llama3.1

[cache]
# Path to the market news cache file, relative to the repo root.
log_path = market_log.md
# How many hours a cached scan_market_news result stays fresh before it's
# treated as stale and re-searched live.
freshness_hours = 4
